<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>My Documents | SevaLog</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link rel="stylesheet" href="../public-layout.css">
    <link rel="stylesheet" href="volunteer-layout.css">
    <link rel="stylesheet" href="documents.css">

    <!-- PWA Manifest -->
    <link rel="manifest" href="../../manifest.json">

    <!-- iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="SevaLog">
    <link rel="apple-touch-icon" href="/assets/icons/icon-192x192.png">

    <!-- Theme Color for Browser Chrome -->
    <meta name="theme-color" content="#3B82F6">
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo"><i data-lucide="heart" style="color: var(--accent-primary);"></i> SevaLog</div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
            <a href="my-events.html" class="nav-item"><i data-lucide="calendar"></i> My Events</a>
            <a href="volunteer-tasks.html" class="nav-item"><i data-lucide="check-square"></i> Tasks</a>
            <a href="community.html" class="nav-item"><i data-lucide="users"></i> Community Hub</a>
            <a href="documents.html" class="nav-item active"><i data-lucide="file-text"></i> Documents</a>
            <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border-light);">
                <a href="settings.html" class="nav-item"><i data-lucide="settings"></i> Settings</a>
                <a href="#" id="logout-btn" class="nav-item" style="color: #EF4444;"><i data-lucide="log-out"></i> Log Out</a>
            </div>
        </nav>
    </aside>

    <div class="app-content">
        <header class="top-bar">
            <button id="mobile-menu-btn" class="icon-btn mobile-menu-btn" aria-label="Open navigation"><i data-lucide="menu"></i></button>
            <div class="page-title"><h3>Verified Documents</h3></div>
            <div style="display: flex; align-items: center; gap: 20px;">
                <button class="icon-btn"><i data-lucide="bell"></i></button>
                <div class="user-profile-menu">
                    <div class="avatar" id="user-initial">U</div>
                    <span id="user-name-top" style="font-weight: 700; font-size: 14px;">User</span>
                </div>
            </div>
        </header>

        <main class="main-viewport">
            <div id="certificates-container" style="display: flex; flex-direction: column; gap: 40px;">
                <div class="loading-state"><i data-lucide="loader-2" class="spin"></i> Loading your verified certificates...</div>
            </div>
        </main>
    </div>

    <!-- UPDATED CERTIFICATE MODAL -->
    <div class="modal-overlay" id="certificateModal">
        <div class="modal-content-cert">
            
            <!-- Modal Controls -->
            <div style="width: 100%; max-width: 850px; display: flex; justify-content: flex-end; gap: 12px; margin-bottom: 16px;">
                <button id="modal-download-btn" style="background: white; color: #0F172A; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                    <i data-lucide="download" style="width: 16px;"></i> Download PDF
                </button>
                <button onclick="closeCertificateModal()" style="background: white; color: #0F172A; border: none; width: 38px; height: 38px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                    <i data-lucide="x" style="width: 18px;"></i>
                </button>
            </div>

            <!-- Scrollable container for the certificate -->
            <div id="modal-certificate-render-area" style="overflow-x: auto; width: 100%; max-width: 850px; border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); background: white;">
                <!-- The JS will inject the certificate here -->
            </div>

        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../public-main.js"></script>
    <script src="../../js/volunteer/documents.js"></script>
    <script src="../../js/pwa.js"></script>
    <script src="../../js/protect.js"></script>
</body>
</html>
