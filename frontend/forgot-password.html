<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Forgot Password | SevaLog</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="public-layout.css">
    <link rel="stylesheet" href="login.css">

    <!-- PWA Manifest -->
    <link rel="manifest" href="../manifest.json">

    <!-- iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="SevaLog">
    <link rel="apple-touch-icon" href="/assets/icons/icon-192x192.png">

    <!-- Theme Color for Browser Chrome -->
    <meta name="theme-color" content="#3B82F6">
</head>

<body>

    <div class="auth-container">
        <div class="auth-visual">
            <div class="visual-content">
                <a href="../index.html" class="auth-logo">
                    <i data-lucide="heart"></i> SevaLog
                </a>
                <h1>Recover your <span class="text-gradient">Access.</span></h1>
                <p>Forgot your password? No problem. Enter your registered email and we'll send you instructions to reset your account password.</p>
            </div>
        </div>

        <div class="auth-form-side">
            <div class="form-wrapper reveal">
                <div class="form-header">
                    <h2>Reset Your Password</h2>
                    <p>Remembered your password? <a href="login.html">Back to Sign In</a></p>
                </div>

                <div id="forgot-page-alert" class="auth-alert"></div>

                <form id="forgot-password-page-form">
                    <div class="input-group">
                        <label for="forgot-page-email">Registered Email Address</label>
                        <div class="input-field">
                            <i data-lucide="mail"></i>
                            <input type="email" id="forgot-page-email" placeholder="john@example.com" autocomplete="email" required>
                        </div>
                    </div>

                    <button type="submit" id="forgot-page-submit-btn" class="btn btn-primary auth-btn">
                        Send Reset Link <i data-lucide="send"></i>
                    </button>
                </form>

                <div style="margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border-light); text-align: center; font-size: 14px; color: var(--text-muted);">
                    Already have a token or received a reset link? <br>
                    <a href="reset-password.html" style="color: var(--accent-primary); font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; margin-top: 8px;">
                        Set New Password <i data-lucide="arrow-right" style="width: 14px;"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="public-main.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/pwa.js"></script>
    <script src="../js/protect.js"></script>
</body>

</html>
